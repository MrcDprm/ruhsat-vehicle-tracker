<!-- Supabase > Authentication > Emails: "Magic link" ve "Confirm signup" şablonlarının ikisine de yapıştırılır.
     Konu: Ruhsat giriş kodun: {{ .Token }} -->
<div style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 440px; margin: 0 auto; padding: 24px; color: #23262B; background: #F2EEE5;">
  <p style="margin: 0 0 4px; font-size: 12px; letter-spacing: 1.5px; color: #6E6A62;">RUHSAT</p>
  <h1 style="margin: 0 0 16px; font-size: 20px;">Giriş kodun</h1>
  <p style="margin: 0 0 20px; font-size: 32px; font-weight: 700; letter-spacing: 8px; font-family: Menlo, Consolas, monospace; color: #C9821B;">{{ .Token }}</p>
  <p style="margin: 0 0 8px; font-size: 14px;">Kodu uygulamaya yaz. 10 dakika geçerli. Bu girişi sen istemediysen e-postayı yok sayabilirsin.</p>
  <p style="margin: 0; font-size: 13px; color: #6E6A62;">Your Ruhsat sign-in code is {{ .Token }}. It is valid for 10 minutes. If you didn’t ask for it, you can ignore this email.</p>
</div>
